services:
  - type: web
    name: atlas-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Data, files, AI keys, Google OAuth and encryption live on the Convex deployment
      # (npx convex env set ...); see docs/atlas-wardrobe-v2-architecture.md section 13.
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: ATLAS_SESSION_SECRET
        generateValue: true
      - key: ATLAS_PUBLIC_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

name: Atlas Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nanobot/atlas/**"
      - "scripts/atlas_*.py"
      - "tests/atlas/**"
      - ".atlas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/atlas-ci.yml"
  push:
    branches: [main]
    paths:
      - "nanobot/atlas/**"
      - "scripts/atlas_*.py"
      - "tests/atlas/**"
      - ".atlas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/atlas-ci.yml"

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas-regression:
    name: Atlas offline regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Atlas dependencies
        run: uv sync --extra atlas --extra dev

      - name: Run Atlas tests
        run: uv run --no-sync pytest tests/atlas -q

      - name: Check Atlas formatting and lint
        run: uv run --no-sync ruff check nanobot/atlas scripts tests/atlas

      - name: Type-check Atlas package
        run: uv run --no-sync basedpyright nanobot/atlas

      - name: Compile Atlas and scripts
        run: uv run --no-sync python -m compileall -q nanobot scripts tests

      - name: Confirm no credential files are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\.|client_secret\.json)([^/]*$|/)' ; then
            echo "Credential-like file is tracked" >&2
            exit 1
          fi
